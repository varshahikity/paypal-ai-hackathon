<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="conceptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#140f2d"/>
    </linearGradient>

    <linearGradient id="flowArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .semibold { font-weight: 600; }
    .medium { font-weight: 500; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1100" height="420" rx="16" fill="url(#conceptBg)"/>
  
  <!-- Outer subtle border -->
  <rect width="1100" height="420" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Title / Indicator -->
  <g transform="translate(40, 36)">
    <text class="font-sans bold" font-size="20" fill="url(#headerGrad)">SmartCart AI End-to-End Conceptual Flow</text>
    <text x="0" y="22" class="font-sans medium" font-size="12" fill="#64748B">How autonomous AI agents transform natural intent into verified value purchases</text>
  </g>

  <!-- Connective Flow Line behind cards -->
  <line x1="160" y1="230" x2="940" y2="230" stroke="url(#flowArrow)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- 4 STEP CARDS -->

  <!-- STEP 1: Conversational Input -->
  <g transform="translate(40, 85)" filter="url(#cardShadow)">
    <rect width="230" height="295" rx="14" fill="url(#cardGradient1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    
    <!-- Step Badge -->
    <rect x="16" y="16" width="60" height="22" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="24" y="31" class="font-sans bold mono" font-size="10" fill="#38BDF8">STEP 01</text>
    
    <!-- Step Title -->
    <text x="16" y="65" class="font-sans bold" font-size="15" fill="#FFFFFF">Natural Intent</text>
    <text x="16" y="82" class="font-sans" font-size="11" fill="#94A3B8">User interacts via plain speech</text>

    <!-- Simulated Prompt Bubble -->
    <g transform="translate(16, 100)">
      <rect width="198" height="74" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="10" y="20" class="font-sans semibold" font-size="10" fill="#38BDF8">USER PROMPT:</text>
      <text x="10" y="36" class="font-sans" font-size="11" fill="#E2E8F0">"Find a 65W GaN charger</text>
      <text x="10" y="52" class="font-sans" font-size="11" fill="#E2E8F0">with 3 ports under $40</text>
      <text x="10" y="68" class="font-sans" font-size="11" fill="#E2E8F0">for international travel."</text>
    </g>

    <!-- Extracted Criteria -->
    <g transform="translate(16, 190)">
      <text x="0" y="14" class="font-sans semibold" font-size="10" fill="#64748B">PARSED PARAMETERS:</text>
      <rect x="0" y="24" width="92" height="20" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
      <text x="6" y="37" class="font-sans mono" font-size="9" fill="#7DD3FC">Power: 65W GaN</text>

      <rect x="100" y="24" width="98" height="20" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
      <text x="106" y="37" class="font-sans mono" font-size="9" fill="#7DD3FC">Budget: &lt; $40</text>

      <rect x="0" y="50" width="85" height="20" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
      <text x="6" y="63" class="font-sans mono" font-size="9" fill="#7DD3FC">Ports: 3+ USB</text>

      <rect x="92" y="50" width="106" height="20" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
      <text x="98" y="63" class="font-sans mono" font-size="9" fill="#7DD3FC">Use: Travel Plugs</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <g transform="translate(280, 222)">
    <circle cx="10" cy="8" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 6 8 L 14 8 M 11 5 L 14 8 L 11 11" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 2: Agent Discovery & Analysis -->
  <g transform="translate(305, 85)" filter="url(#cardShadow)">
    <rect width="230" height="295" rx="14" fill="url(#cardGradient1)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="60" height="22" rx="6" fill="rgba(129, 140, 248, 0.15)"/>
    <text x="24" y="31" class="font-sans bold mono" font-size="10" fill="#818CF8">STEP 02</text>
    
    <text x="16" y="65" class="font-sans bold" font-size="15" fill="#FFFFFF">Agent Intelligence</text>
    <text x="16" y="82" class="font-sans" font-size="11" fill="#94A3B8">Parallel autonomous exploration</text>

    <!-- Agent Stack -->
    <g transform="translate(16, 100)">
      <!-- Discovery Sub-agent -->
      <rect width="198" height="48" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <circle cx="16" cy="24" r="5" fill="#38BDF8"/>
      <text x="28" y="20" class="font-sans bold" font-size="11" fill="#FFFFFF">Discovery Agent</text>
      <text x="28" y="35" class="font-sans" font-size="10" fill="#94A3B8">Catalog retrieval &amp; specs match</text>

      <!-- Price Tracker Agent -->
      <g transform="translate(0, 56)">
        <rect width="198" height="48" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        <circle cx="16" cy="24" r="5" fill="#C084FC"/>
        <text x="28" y="20" class="font-sans bold" font-size="11" fill="#FFFFFF">Price &amp; Coupon Agent</text>
        <text x="28" y="35" class="font-sans" font-size="10" fill="#94A3B8">Real-time discount checks</text>
      </g>

      <!-- Sentiment Agent -->
      <g transform="translate(0, 112)">
        <rect width="198" height="48" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        <circle cx="16" cy="24" r="5" fill="#34D399"/>
        <text x="28" y="20" class="font-sans bold" font-size="11" fill="#FFFFFF">Review Sentiment Agent</text>
        <text x="28" y="35" class="font-sans" font-size="10" fill="#94A3B8">Heat rating &amp; verified reviews</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(545, 222)">
    <circle cx="10" cy="8" r="14" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <path d="M 6 8 L 14 8 M 11 5 L 14 8 L 11 11" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 3: Comparison & Cart Optimization -->
  <g transform="translate(570, 85)" filter="url(#cardShadow)">
    <rect width="230" height="295" rx="14" fill="url(#cardGradient1)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="60" height="22" rx="6" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="24" y="31" class="font-sans bold mono" font-size="10" fill="#C084FC">STEP 03</text>
    
    <text x="16" y="65" class="font-sans bold" font-size="15" fill="#FFFFFF">Value Optimization</text>
    <text x="16" y="82" class="font-sans" font-size="11" fill="#94A3B8">Trade-offs &amp; dynamic discounts</text>

    <!-- Mini Comparison Table -->
    <g transform="translate(16, 100)">
      <rect width="198" height="88" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      
      <!-- Option A (Recommended) -->
      <g transform="translate(8, 8)">
        <rect width="182" height="34" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="8" y="15" class="font-sans bold" font-size="10" fill="#34D399">#1 ChargeMax 65W Pro</text>
        <text x="8" y="27" class="font-sans" font-size="9" fill="#94A3B8">3 Ports • 98% Match</text>
        <text x="174" y="21" text-anchor="end" class="font-sans bold" font-size="11" fill="#FFFFFF">$32.99</text>
      </g>

      <!-- Option B -->
      <g transform="translate(8, 48)">
        <text x="8" y="15" class="font-sans" font-size="10" fill="#94A3B8">#2 VoltTravel Slim 60W</text>
        <text x="8" y="27" class="font-sans" font-size="9" fill="#64748B">2 Ports • 88% Match</text>
        <text x="174" y="21" text-anchor="end" class="font-sans" font-size="10" fill="#64748B">$38.50</text>
      </g>
    </g>

    <!-- Applied Optimizer Savings -->
    <g transform="translate(16, 202)">
      <rect width="198" height="66" rx="8" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="10" y="20" class="font-sans bold" font-size="10" fill="#FBBF24">CART SAVINGS ENGINE</text>
      <text x="10" y="38" class="font-sans" font-size="10" fill="#E2E8F0">Auto-Applied Code: SAVE15</text>
      <text x="10" y="54" class="font-sans bold" font-size="12" fill="#34D399">Total Benefit: -$7.00 (18% off)</text>
    </g>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <g transform="translate(810, 222)">
    <circle cx="10" cy="8" r="14" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M 6 8 L 14 8 M 11 5 L 14 8 L 11 11" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 4: Informed Decision & Checkout -->
  <g transform="translate(835, 85)" filter="url(#cardShadow)">
    <rect width="225" height="295" rx="14" fill="url(#cardGradient1)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="60" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="24" y="31" class="font-sans bold mono" font-size="10" fill="#34D399">STEP 04</text>
    
    <text x="16" y="65" class="font-sans bold" font-size="15" fill="#FFFFFF">Smart Checkout</text>
    <text x="16" y="82" class="font-sans" font-size="11" fill="#94A3B8">Informed, verified purchase</text>

    <!-- Summary Box -->
    <g transform="translate(16, 100)">
      <rect width="193" height="88" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="10" y="22" class="font-sans" font-size="10" fill="#94A3B8">Original Retail:</text>
      <text x="183" y="22" text-anchor="end" class="font-sans" font-size="10" fill="#64748B" text-decoration="line-through">$39.99</text>

      <text x="10" y="42" class="font-sans" font-size="10" fill="#38BDF8">Optimized Cart:</text>
      <text x="183" y="42" text-anchor="end" class="font-sans bold" font-size="11" fill="#FFFFFF">$32.99</text>

      <line x1="10" y1="52" x2="183" y2="52" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

      <text x="10" y="70" class="font-sans bold" font-size="11" fill="#34D399">Final Checkout:</text>
      <text x="183" y="72" text-anchor="end" class="font-sans bold" font-size="14" fill="#34D399">$25.99</text>
    </g>

    <!-- PayPal Button Proposed -->
    <g transform="translate(16, 204)">
      <rect width="193" height="42" rx="8" fill="#0070BA"/>
      <text x="96" y="26" text-anchor="middle" class="font-sans bold" font-size="12" fill="#FFFFFF">Pay with PayPal</text>
      <rect x="0" y="52" width="193" height="24" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="96" y="68" text-anchor="middle" class="font-sans" font-size="9" fill="#94A3B8">Proposed Sandbox Integration</text>
    </g>
  </g>
</svg>
