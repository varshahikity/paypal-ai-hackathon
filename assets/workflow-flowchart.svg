<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f1d"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="wfGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .semibold { font-weight: 600; }
    .medium { font-weight: 500; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1200" height="800" fill="url(#wfBg)"/>
  <rect width="1200" height="800" fill="url(#wfGrid)"/>
  <rect width="1200" height="800" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- TOP BANNER -->
  <g transform="translate(48, 36)">
    <rect width="320" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" class="sans semibold mono" font-size="10" fill="#7DD3FC" letter-spacing="1">AGENTIC COMMERCE PIPELINE • END-TO-END</text>
    
    <text x="0" y="58" class="sans bold" font-size="28" fill="url(#headerGrad)" letter-spacing="-0.5">SmartCart AI Workflow Flowchart</text>
    <text x="0" y="80" class="sans medium" font-size="13" fill="#94A3B8">From raw conversational query to multi-agent discovery, budget balancing, and 1-click PayPal checkout</text>
  </g>

  <!-- ==================== FLOW COLUMNS ==================== -->

  <!-- STAGE 1: USER INPUT & INTENT (X: 48) -->
  <g transform="translate(48, 140)">
    <!-- Stage Header -->
    <rect width="250" height="30" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="12" y="20" class="sans bold" font-size="12" fill="#38BDF8">PHASE 1: INTENT &amp; CRITERIA</text>

    <!-- Card 1: User Prompt -->
    <g transform="translate(0, 42)" filter="url(#cardShadow)">
      <rect width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="10" fill="#2563EB"/>
      <text x="16" y="26" class="sans bold" font-size="11" fill="#FFFFFF">👤</text>
      <text x="38" y="26" class="sans bold" font-size="13" fill="#FFFFFF">User Input Prompt</text>
      <text x="16" y="50" class="sans" font-size="11" fill="#94A3B8">Natural-language shopping query:</text>
      <rect x="12" y="58" width="226" height="50" rx="6" fill="rgba(15, 23, 42, 0.8)"/>
      <text x="20" y="76" class="sans italic" font-size="11" fill="#E2E8F0">"Find ANC headphones under</text>
      <text x="20" y="94" class="sans italic" font-size="11" fill="#E2E8F0">$250 for travel with 30h+ battery"</text>
    </g>

    <!-- Down Arrow 1 -->
    <path d="M 125 174 L 125 198" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="121,196 125,204 129,196" fill="#38BDF8"/>

    <!-- Card 2: Intent Agent -->
    <g transform="translate(0, 212)" filter="url(#cardShadow)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="10" fill="#7C3AED"/>
      <text x="16" y="26" class="sans bold" font-size="11" fill="#FFFFFF">🧠</text>
      <text x="38" y="26" class="sans bold" font-size="13" fill="#FFFFFF">Intent Understanding Agent</text>
      <text x="16" y="48" class="sans" font-size="11" fill="#94A3B8">Structured parameter extraction:</text>
      
      <!-- Extracted Tags -->
      <g transform="translate(14, 58)">
        <rect width="105" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="8" y="15" class="sans mono" font-size="10" fill="#7DD3FC">ANC: True (High)</text>

        <rect x="115" width="105" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="123" y="15" class="sans mono" font-size="10" fill="#7DD3FC">Budget: &lt; $250</text>

        <rect y="28" width="105" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="8" y="43" class="sans mono" font-size="10" fill="#7DD3FC">Battery: &gt; 30 hrs</text>

        <rect x="115" y="28" width="105" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="123" y="43" class="sans mono" font-size="10" fill="#7DD3FC">Category: Travel</text>
      </g>
    </g>

    <!-- Down Arrow 2 to Orchestrator -->
    <path d="M 125 374 L 125 398" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="121,396 125,404 129,396" fill="#818CF8"/>

    <!-- Card 3: AI Orchestrator -->
    <g transform="translate(0, 412)" filter="url(#cardShadow)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.8"/>
      <circle cx="20" cy="22" r="10" fill="#A855F7"/>
      <text x="16" y="26" class="sans bold" font-size="11" fill="#FFFFFF">⚡</text>
      <text x="38" y="26" class="sans bold" font-size="14" fill="#FFFFFF">Master AI Orchestrator</text>
      <text x="16" y="50" class="sans" font-size="11" fill="#C084FC">LangGraph Workflow Hub</text>
      <text x="16" y="70" class="sans" font-size="11" fill="#94A3B8">• Synchronizes agent states</text>
      <text x="16" y="88" class="sans" font-size="11" fill="#94A3B8">• Parallel dispatch to workers</text>
      <text x="16" y="106" class="sans" font-size="11" fill="#94A3B8">• Resolves candidate trade-offs</text>
      <text x="16" y="124" class="sans" font-size="11" fill="#94A3B8">• Prepares cart state</text>
    </g>
  </g>

  <!-- CONNECTOR: Orchestrator -> Parallel Swarm (Horizontal connector) -->
  <path d="M 298 487 L 348 487 L 348 240 L 378 240" stroke="#C084FC" stroke-width="2" fill="none"/>
  <polygon points="376,236 384,240 376,244" fill="#C084FC"/>

  <path d="M 348 375 L 378 375" stroke="#C084FC" stroke-width="2" fill="none"/>
  <polygon points="376,371 384,375 376,379" fill="#C084FC"/>

  <path d="M 348 510 L 378 510" stroke="#C084FC" stroke-width="2" fill="none"/>
  <polygon points="376,506 384,510 376,514" fill="#C084FC"/>

  <!-- STAGE 2: PARALLEL AGENTS & EXTERNAL DATA (X: 388) -->
  <g transform="translate(388, 140)">
    <rect width="440" height="30" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
    <text x="12" y="20" class="sans bold" font-size="12" fill="#C084FC">PHASE 2: AUTONOMOUS PARALLEL AGENTS &amp; REPOSITORIES</text>

    <!-- Swarm Item 1: Discovery Agent + Vector DB -->
    <g transform="translate(0, 42)" filter="url(#cardShadow)">
      <rect width="210" height="115" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="8" fill="#0284C7"/>
      <text x="14" y="22" class="sans bold" font-size="10" fill="#FFFFFF">🔍</text>
      <text x="32" y="22" class="sans bold" font-size="12" fill="#FFFFFF">Discovery Agent</text>
      <text x="12" y="44" class="sans" font-size="10" fill="#94A3B8">• Semantic similarity match</text>
      <text x="12" y="60" class="sans" font-size="10" fill="#94A3B8">• Spec constraint filters</text>
      <rect x="10" y="74" width="190" height="30" rx="6" fill="rgba(15, 23, 42, 0.8)"/>
      <text x="18" y="93" class="sans bold" font-size="10" fill="#38BDF8">Scanned: 42 candidates</text>

      <!-- Linked Database Box (To its right) -->
      <g transform="translate(230, 10)">
        <path d="M -20 48 L 0 48" stroke="#38BDF8" stroke-width="2"/>
        <polygon points="-2,44 6,48 -2,52" fill="#38BDF8"/>
        <rect width="200" height="95" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
        <text x="12" y="22" class="sans bold" font-size="11" fill="#38BDF8">📦 Product Catalogs &amp; DB</text>
        <text x="12" y="42" class="sans" font-size="10" fill="#94A3B8">• pgvector / Qdrant Embeddings</text>
        <text x="12" y="58" class="sans" font-size="10" fill="#94A3B8">• E-Commerce mock catalog</text>
        <text x="12" y="74" class="sans" font-size="10" fill="#94A3B8">• Real-time spec index</text>
      </g>
    </g>

    <!-- Swarm Item 2: Price Tracker Agent + Live APIs -->
    <g transform="translate(0, 175)" filter="url(#cardShadow)">
      <rect width="210" height="115" rx="10" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="8" fill="#D97706"/>
      <text x="14" y="22" class="sans bold" font-size="10" fill="#FFFFFF">🏷️</text>
      <text x="32" y="22" class="sans bold" font-size="12" fill="#FFFFFF">Price &amp; Coupon Agent</text>
      <text x="12" y="44" class="sans" font-size="10" fill="#94A3B8">• Multi-vendor price crawl</text>
      <text x="12" y="60" class="sans" font-size="10" fill="#94A3B8">• Promo code validation</text>
      <rect x="10" y="74" width="190" height="30" rx="6" fill="rgba(15, 23, 42, 0.8)"/>
      <text x="18" y="93" class="sans bold" font-size="10" fill="#FBBF24">Found: FLYTECH25 (-$25)</text>

      <!-- Linked Coupon API Box -->
      <g transform="translate(230, 10)">
        <path d="M -20 48 L 0 48" stroke="#FBBF24" stroke-width="2"/>
        <polygon points="-2,44 6,48 -2,52" fill="#FBBF24"/>
        <rect width="200" height="95" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
        <text x="12" y="22" class="sans bold" font-size="11" fill="#FBBF24">🌐 Live Deals &amp; Promo APIs</text>
        <text x="12" y="42" class="sans" font-size="10" fill="#94A3B8">• Merchant discount endpoints</text>
        <text x="12" y="58" class="sans" font-size="10" fill="#94A3B8">• Auto-stacking coupon feed</text>
        <text x="12" y="74" class="sans" font-size="10" fill="#94A3B8">• Currency conversion engine</text>
      </g>
    </g>

    <!-- Swarm Item 3: Review Sentiment Agent + Reviews DB -->
    <g transform="translate(0, 310)" filter="url(#cardShadow)">
      <rect width="210" height="115" rx="10" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="8" fill="#059669"/>
      <text x="14" y="22" class="sans bold" font-size="10" fill="#FFFFFF">🛡️</text>
      <text x="32" y="22" class="sans bold" font-size="12" fill="#FFFFFF">Review Sentiment Agent</text>
      <text x="12" y="44" class="sans" font-size="10" fill="#94A3B8">• Deceptive review filtering</text>
      <text x="12" y="60" class="sans" font-size="10" fill="#94A3B8">• Flight noise comfort score</text>
      <rect x="10" y="74" width="190" height="30" rx="6" fill="rgba(15, 23, 42, 0.8)"/>
      <text x="18" y="93" class="sans bold" font-size="10" fill="#34D399">Trust Rating: 96% Genuine</text>

      <!-- Linked Sentiment Data Box -->
      <g transform="translate(230, 10)">
        <path d="M -20 48 L 0 48" stroke="#34D399" stroke-width="2"/>
        <polygon points="-2,44 6,48 -2,52" fill="#34D399"/>
        <rect width="200" height="95" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
        <text x="12" y="22" class="sans bold" font-size="11" fill="#34D399">⭐ Verified Buyer Reviews</text>
        <text x="12" y="42" class="sans" font-size="10" fill="#94A3B8">• Real customer feedback</text>
        <text x="12" y="58" class="sans" font-size="10" fill="#94A3B8">• Anti-bot sentiment analysis</text>
        <text x="12" y="74" class="sans" font-size="10" fill="#94A3B8">• Verified purchase tags</text>
      </g>
    </g>
  </g>

  <!-- CONNECTOR: Agents -> Synthesis (Converging arrow lines) -->
  <path d="M 830 240 L 870 240 L 870 330 L 890 330" stroke="#38BDF8" stroke-width="2" fill="none"/>
  <polygon points="888,326 896,330 888,334" fill="#38BDF8"/>

  <path d="M 830 375 L 890 375" stroke="#FBBF24" stroke-width="2" fill="none"/>
  <polygon points="888,371 896,375 888,379" fill="#FBBF24"/>

  <path d="M 830 510 L 870 510 L 870 420 L 890 420" stroke="#34D399" stroke-width="2" fill="none"/>
  <polygon points="888,416 896,420 888,424" fill="#34D399"/>

  <!-- STAGE 3: SYNTHESIS, DECISION & CHECKOUT (X: 900) -->
  <g transform="translate(900, 140)">
    <rect width="252" height="30" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="12" y="20" class="sans bold" font-size="12" fill="#34D399">PHASE 3: DECISION &amp; PAYPAL</text>

    <!-- Card 1: Decision Matrix -->
    <g transform="translate(0, 42)" filter="url(#cardShadow)">
      <rect width="252" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="10" fill="#6366F1"/>
      <text x="16" y="24" class="sans bold" font-size="11" fill="#FFFFFF">⚖️</text>
      <text x="36" y="24" class="sans bold" font-size="13" fill="#FFFFFF">Decision &amp; Cart Optimizer</text>
      
      <rect x="12" y="42" width="228" height="40" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="20" y="58" class="sans bold" font-size="11" fill="#34D399">#1 Match: AeroQuiet Pro (98%)</text>
      <text x="20" y="74" class="sans" font-size="10" fill="#94A3B8">42h Battery • Premium ANC Comfort</text>

      <!-- Cart optimization calculation -->
      <g transform="translate(14, 92)">
        <text x="0" y="14" class="sans" font-size="10" fill="#94A3B8">MSRP: $269.00</text>
        <text x="100" y="14" class="sans bold" font-size="10" fill="#FBBF24">Coupon: -$25.00</text>
        <text x="0" y="30" class="sans bold" font-size="12" fill="#34D399">Optimized Cart: $174.00</text>
      </g>
    </g>

    <!-- Down Arrow to Decision -->
    <path d="M 126 188 L 126 210" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <polygon points="122,208 126,216 130,208" fill="#34D399"/>

    <!-- Card 2: User Informed Choice -->
    <g transform="translate(0, 222)" filter="url(#cardShadow)">
      <rect width="252" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="10" fill="#0284C7"/>
      <text x="16" y="24" class="sans bold" font-size="11" fill="#FFFFFF">✅</text>
      <text x="36" y="24" class="sans bold" font-size="13" fill="#FFFFFF">Informed Shopping Decision</text>
      <text x="16" y="48" class="sans" font-size="11" fill="#94A3B8">Shopper reviews transparent metrics:</text>
      <text x="16" y="66" class="sans bold" font-size="10" fill="#E2E8F0">• Genuine Reviews: Verified</text>
      <text x="16" y="82" class="sans bold" font-size="10" fill="#E2E8F0">• Net Savings: $95.00 (35% off)</text>
      <text x="16" y="98" class="sans bold" font-size="10" fill="#34D399">• Best-Value Guarantee</text>
    </g>

    <!-- Down Arrow to PayPal -->
    <path d="M 126 342 L 126 364" stroke="#0070BA" stroke-width="2" stroke-linecap="round"/>
    <polygon points="122,362 126,370 130,362" fill="#0070BA"/>

    <!-- Card 3: 1-Click PayPal Checkout -->
    <g transform="translate(0, 376)" filter="url(#cardShadow)">
      <rect width="252" height="135" rx="12" fill="rgba(0, 48, 135, 0.3)" stroke="rgba(0, 112, 186, 0.7)" stroke-width="1.8"/>
      <rect x="12" y="14" width="70" height="22" rx="4" fill="#003087"/>
      <text x="18" y="29" class="sans bold" font-size="12" fill="#FFFFFF">PayPal</text>
      <text x="90" y="30" class="sans bold" font-size="13" fill="#FFFFFF">Smart Checkout</text>
      
      <!-- Yellow Button Mockup -->
      <g transform="translate(14, 46)">
        <rect width="224" height="38" rx="19" fill="#FFC439"/>
        <text x="112" y="24" text-anchor="middle" class="sans bold" font-size="13" fill="#003087">Pay with PayPal</text>
      </g>
      <text x="126" y="104" text-anchor="middle" class="sans" font-size="10" fill="#93C5FD">Proposed Sandbox API Integration</text>
      <text x="126" y="120" text-anchor="middle" class="sans mono" font-size="9" fill="#64748B">Instant Order Capture &amp; Cart Clearance</text>
    </g>
  </g>

  <!-- FOOTER LEGEND BAR -->
  <g transform="translate(48, 730)">
    <line x1="0" y1="0" x2="1104" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="0" y="24" class="sans medium" font-size="11" fill="#64748B">Flow Architecture: Conversational NLP → Multi-Agent Async Swarm → Real-Time APIs → Value Trade-Off Engine → PayPal Checkout</text>
    <text x="1104" y="24" text-anchor="end" class="sans bold mono" font-size="11" fill="#38BDF8">PAYPAL AI HACKATHON 2026</text>
  </g>
</svg>
