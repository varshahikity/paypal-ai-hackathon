<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="taglineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="paypalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#0079C1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(147, 197, 253, 0.15)"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .semibold { font-weight: 600; }
    .medium { font-weight: 500; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="500" fill="url(#bgGradient)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- Ambient Ambient Lighting / Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#3B82F6" opacity="0.18" filter="url(#glowCyan)"/>
  <circle cx="950" cy="180" r="180" fill="#8B5CF6" opacity="0.22" filter="url(#glowPurple)"/>
  <circle cx="650" cy="420" r="160" fill="#06B6D4" opacity="0.12" filter="url(#glowCyan)"/>

  <!-- LEFT HERO SECTION: Branding & Value Proposition -->
  <g transform="translate(70, 0)">
    <!-- Hackathon & Status Badge -->
    <g transform="translate(0, 68)">
      <rect width="365" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#38BDF8"/>
      <circle cx="16" cy="16" r="9" fill="#38BDF8" opacity="0.3"/>
      <text x="32" y="21" class="font-sans semibold mono" font-size="11" fill="#C7D2FE" letter-spacing="1">PAYPAL AI HACKATHON • 2026 ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 160)">
      <text class="font-sans bold" font-size="58" fill="url(#titleGradient)" letter-spacing="-1.5">SmartCart AI</text>
      <circle cx="375" cy="-28" r="6" fill="#38BDF8"/>
    </g>

    <!-- Tagline -->
    <g transform="translate(0, 202)">
      <text class="font-sans semibold" font-size="24" fill="url(#taglineGradient)" letter-spacing="-0.5">Your Intelligent Shopping Companion</text>
    </g>

    <!-- Descriptive Pitch -->
    <g transform="translate(0, 245)">
      <text class="font-sans medium" font-size="15" fill="#94A3B8" line-height="24">
        <tspan x="0" y="0">Autonomous multi-agent commerce engine transforming natural-language</tspan>
        <tspan x="0" y="24">queries into verified product discoveries, price comparisons, and optimized</tspan>
        <tspan x="0" y="48">shopping carts with smart PayPal checkout readiness.</tspan>
      </text>
    </g>

    <!-- Feature Highlights / Badges -->
    <g transform="translate(0, 345)">
      <!-- Badge 1: Multi-Agent -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#38BDF8"/>
        <text x="30" y="23" class="font-sans semibold" font-size="12" fill="#E2E8F0">Multi-Agent AI</text>
      </g>
      <!-- Badge 2: Cart Optimizer -->
      <g transform="translate(172, 0)">
        <rect width="175" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#C084FC"/>
        <text x="30" y="23" class="font-sans semibold" font-size="12" fill="#E2E8F0">Cart Optimization</text>
      </g>
      <!-- Badge 3: PayPal Ready -->
      <g transform="translate(360, 0)">
        <rect width="165" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#60A5FA"/>
        <text x="30" y="23" class="font-sans semibold" font-size="12" fill="#E2E8F0">PayPal Sandbox</text>
      </g>
    </g>

    <!-- Sub-footer stats/metrics -->
    <g transform="translate(0, 420)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="0" y="28" class="font-sans medium" font-size="12" fill="#64748B">Designed for: Natural Discovery • Real-Time Value Analysis • Frictionless Checkout</text>
    </g>
  </g>

  <!-- RIGHT HERO SECTION: Visual Composition & Agent Mockup -->
  <g transform="translate(680, 50)" filter="url(#subtleShadow)">
    <!-- Main Glassmorphic Container Card -->
    <rect width="450" height="390" rx="20" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Card Top Header Bar -->
    <g transform="translate(24, 24)">
      <!-- Window Dots -->
      <circle cx="0" cy="0" r="5" fill="#EF4444"/>
      <circle cx="15" cy="0" r="5" fill="#F59E0B"/>
      <circle cx="30" cy="0" r="5" fill="#10B981"/>

      <!-- Header Label -->
      <text x="55" y="4" class="font-sans semibold mono" font-size="12" fill="#94A3B8">SmartCart Agent Orchestration Hub</text>

      <!-- Active Pulse Badge -->
      <g transform="translate(320, -10)">
        <rect width="76" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
        <circle cx="11" cy="11" r="3" fill="#10B981"/>
        <text x="20" y="15" class="font-sans bold" font-size="10" fill="#34D399">ACTIVE</text>
      </g>
    </g>

    <!-- Simulated User Query Bubble -->
    <g transform="translate(24, 58)">
      <rect width="402" height="52" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="16" y="22" class="font-sans semibold" font-size="11" fill="#38BDF8">USER INTENT</text>
      <text x="16" y="38" class="font-sans medium" font-size="13" fill="#F1F5F9">"Find me ANC headphones under $250 for long flights &amp; best battery"</text>
    </g>

    <!-- Agent Coordination Network Viz -->
    <g transform="translate(24, 124)">
      <!-- Orchestrator Center Node -->
      <rect width="402" height="42" rx="10" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
      <circle cx="24" cy="21" r="7" fill="url(#accentCyan)"/>
      <text x="40" y="26" class="font-sans bold" font-size="12" fill="#FFFFFF">AI Orchestrator (Intent + Dispatch)</text>
      <text x="325" y="26" class="font-sans mono" font-size="11" fill="#A5B4FC">4 Agents</text>
    </g>

    <!-- Connected Mini-Agent Status Tiles -->
    <g transform="translate(24, 178)">
      <!-- Discovery Agent -->
      <g transform="translate(0, 0)">
        <rect width="193" height="46" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="12" y="18" class="font-sans bold" font-size="11" fill="#93C5FD">Discovery Agent</text>
        <text x="12" y="34" class="font-sans" font-size="10" fill="#94A3B8">38 models scanned</text>
        <circle cx="175" cy="23" r="4" fill="#10B981"/>
      </g>

      <!-- Price & Deal Agent -->
      <g transform="translate(209, 0)">
        <rect width="193" height="46" rx="8" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="12" y="18" class="font-sans bold" font-size="11" fill="#C084FC">Price Tracker Agent</text>
        <text x="12" y="34" class="font-sans" font-size="10" fill="#94A3B8">Coupons + rebates found</text>
        <circle cx="175" cy="23" r="4" fill="#10B981"/>
      </g>
    </g>

    <!-- Top Recommendation Outcome Card -->
    <g transform="translate(24, 238)">
      <rect width="402" height="74" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
      
      <!-- Mini Product Icon / Badge -->
      <rect x="14" y="14" width="46" height="46" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
      <path d="M 37 25 C 31 25 27 29 27 35 L 27 41 C 27 42 28 43 29 43 L 31 43 C 32 43 33 42 33 41 L 33 37 C 33 36 32 35 31 35 L 29 35 C 29 31 32 28 37 28 C 42 28 45 31 45 35 L 43 35 C 42 35 41 36 41 37 L 41 41 C 41 42 42 43 43 43 L 45 43 C 46 43 47 42 47 41 L 47 35 C 47 29 43 25 37 25 Z" fill="#38BDF8"/>
      
      <!-- Product Details -->
      <text x="70" y="30" class="font-sans bold" font-size="13" fill="#FFFFFF">AeroQuiet Pro Wireless ANC</text>
      <text x="70" y="47" class="font-sans" font-size="11" fill="#94A3B8">Battery: 42h • Match: 98% • Top Sentiment</text>
      
      <!-- Pricing & Savings -->
      <g transform="translate(290, 20)">
        <text x="100" y="12" text-anchor="end" class="font-sans bold" font-size="16" fill="#34D399">$199.00</text>
        <text x="100" y="27" text-anchor="end" class="font-sans" font-size="10" fill="#64748B" text-decoration="line-through">$269.00</text>
        <text x="100" y="42" text-anchor="end" class="font-sans bold" font-size="10" fill="#F59E0B">Save $70 (26%)</text>
      </g>
    </g>

    <!-- Bottom PayPal Integration Strip -->
    <g transform="translate(24, 326)">
      <rect width="402" height="44" rx="10" fill="url(#paypalBlue)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <!-- PayPal Icon Graphic -->
      <g transform="translate(18, 12)">
        <text class="font-sans bold" font-size="15" fill="#FFFFFF" letter-spacing="0.5">P</text>
        <text x="7" y="2" class="font-sans bold" font-size="15" fill="#00CFDE" letter-spacing="0.5">P</text>
      </g>
      <text x="44" y="27" class="font-sans bold" font-size="12" fill="#FFFFFF">1-Click PayPal Checkout (Proposed)</text>
      <text x="385" y="27" text-anchor="end" class="font-sans semibold" font-size="11" fill="#93C5FD">Instant Cart Sync →</text>
    </g>
  </g>
</svg>
