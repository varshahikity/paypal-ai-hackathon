    <text x="26" y="27" class="sans bold mono" font-size="10" fill="#38BDF8">TIER 1 • PRESENTATION &amp; CLIENT</text>
    <text x="250" y="28" class="sans bold" font-size="12" fill="#E2E8F0">Next.js 14 Web App + Tailwind CSS + WebSocket Client</text>

    <!-- Sub-Cards -->
    <g transform="translate(18, 44)">
