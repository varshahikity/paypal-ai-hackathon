    <rect x="18" y="12" width="230" height="22" rx="6" fill="rgba(129, 140, 248, 0.15)"/>
    <text x="26" y="27" class="sans bold mono" font-size="10" fill="#818CF8">TIER 2 • API GATEWAY &amp; BUS</text>
    <text x="260" y="28" class="sans bold" font-size="12" fill="#E2E8F0">FastAPI Asynchronous Gateway + Python 3.11 Runtime</text>

