      <text x="14" y="68" class="sans" font-size="11" fill="#93C5FD">• 1-Click Smart Payment Buttons</text>
      <text x="14" y="88" class="sans" font-size="11" fill="#93C5FD">• Webhook: PAYMENT.CAPTURE</text>
      <text x="14" y="108" class="sans" font-size="11" fill="#93C5FD">• Buyer Protection &amp; PCI Isolation</text>
