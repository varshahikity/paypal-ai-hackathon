        <text x="12" y="42" class="sans" font-size="10" fill="#94A3B8">• Bundle incentives</text>
        <text x="12" y="58" class="sans" font-size="10" fill="#94A3B8">• Shipping threshold</text>
        <text x="12" y="74" class="sans" font-size="10" fill="#94A3B8">• Best-value pick</text>
        <rect x="10" y="84" width="178" height="18" rx="3" fill="rgba(168, 85, 247, 0.1)"/>
