<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="45%" stop-color="#0d1424"/>
      <stop offset="90%" stop-color="#140d28"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="tierHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="layerBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <pattern id="archGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
      <circle cx="35" cy="35" r="1" fill="rgba(147, 197, 253, 0.1)"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .bold { font-weight: 700; }
    .semibold { font-weight: 600; }
    .medium { font-weight: 500; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1400" height="960" fill="url(#archBg)"/>
  <rect width="1400" height="960" fill="url(#archGrid)"/>
  <rect width="1400" height="960" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- TOP TITLE BAR -->
  <g transform="translate(50, 36)">
