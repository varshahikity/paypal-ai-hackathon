  <!-- Connective Arrows 3 -> 4 & 5 -->
  <path d="M 350 623 L 350 655" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="345,653 350,661 355,653" fill="#C084FC"/>

