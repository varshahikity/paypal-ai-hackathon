        <text x="14" y="22" class="sans bold" font-size="12" fill="#93C5FD">💳 PayPal JS SDK Buttons</text>
        <text x="14" y="40" class="sans" font-size="10" fill="#94A3B8">1-Click sandbox modal authorization</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows 1 -> 2 -->
  <path d="M 700 245 L 700 270" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="695,268 700,276 705,268" fill="#38BDF8"/>
  <text x="715" y="262" class="sans mono" font-size="10" fill="#7DD3FC">REST / WebSocket Streaming</text>

