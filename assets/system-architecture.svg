    <text x="26" y="17" class="sans semibold mono" font-size="10" fill="#C7D2FE" letter-spacing="1">PROPOSED SYSTEM ARCHITECTURE • DESIGN SPEC</text>
    
    <text x="0" y="60" class="sans bold" font-size="28" fill="url(#tierHeaderGrad)" letter-spacing="-0.5">SmartCart AI Modular Architecture</text>
    <text x="0" y="82" class="sans medium" font-size="13" fill="#94A3B8">Layered specification decoupling frontend presentation, multi-agent orchestration, LLM reasoning, and PayPal checkout</text>
  </g>

  <!-- ==================== TIER 1: FRONTEND LAYER ==================== -->
  <g transform="translate(50, 135)" filter="url(#boxShadow)">
    <rect width="1300" height="110" rx="14" fill="url(#layerBoxBg)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    
