        <rect width="300" height="52" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="14" y="22" class="sans bold" font-size="12" fill="#FFFFFF">🛒 SmartCart Drawer</text>
        <text x="14" y="40" class="sans" font-size="10" fill="#94A3B8">Dynamic bundle discounts &amp; active coupon ledger</text>
      </g>

