        <text x="14" y="22" class="sans bold" font-size="12" fill="#FFFFFF">⚖️ Decision &amp; Comparison Grid</text>
        <text x="14" y="40" class="sans" font-size="10" fill="#94A3B8">Multi-metric trade-off evaluation &amp; scoring</text>
      </g>

      <!-- Card 3 -->
