      <text x="14" y="24" class="sans bold" font-size="13" fill="#FFFFFF">🧠 LLM &amp; Embeddings</text>
      <text x="14" y="48" class="sans" font-size="11" fill="#94A3B8">• Google Gemini 1.5 Pro (Deep)</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#94A3B8">• Gemini 1.5 Flash (Fast low-latency)</text>
      <text x="14" y="88" class="sans" font-size="11" fill="#94A3B8">• text-embedding-004 vectors</text>
      <text x="14" y="108" class="sans" font-size="11" fill="#94A3B8">• Pydantic structured output guards</text>
      <text x="14" y="132" class="sans bold mono" font-size="10" fill="#38BDF8">Context: 1M+ Tokens</text>
