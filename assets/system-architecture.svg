      <text x="14" y="22" class="sans bold" font-size="11" fill="#FFFFFF">🚪 REST API Endpoints</text>
      <text x="170" y="22" class="sans mono" font-size="10" fill="#818CF8">/api/chat • /api/cart • /api/checkout</text>

      <g transform="translate(430, 0)">
