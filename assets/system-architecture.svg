        <text x="12" y="74" class="sans" font-size="10" fill="#94A3B8">• Longevity score</text>
        <rect x="10" y="84" width="178" height="18" rx="3" fill="rgba(16, 185, 129, 0.1)"/>
        <text x="16" y="96" class="sans mono" font-size="9" fill="#6EE7B7">Trust Index Scoring</text>
