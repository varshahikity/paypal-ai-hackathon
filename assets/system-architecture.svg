      <text x="14" y="24" class="sans bold" font-size="13" fill="#FFFFFF">💾 Persistence &amp; Caching</text>
      <text x="14" y="48" class="sans" font-size="11" fill="#94A3B8">• PostgreSQL (Users, orders, carts)</text>
      <text x="14" y="68" class="sans" font-size="11" fill="#94A3B8">• pgvector / Qdrant (Catalog search)</text>
      <text x="14" y="88" class="sans" font-size="11" fill="#94A3B8">• Redis (Ephemeral session state)</text>
      <text x="14" y="108" class="sans" font-size="11" fill="#94A3B8">• Vector index cosine distance &lt; 0.15</text>
      <text x="14" y="132" class="sans bold mono" font-size="10" fill="#34D399">Sub-10ms Lookup</text>
